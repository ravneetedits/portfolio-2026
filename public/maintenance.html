<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Website in development</title>
    <style>
      :root {
        --ink: #0a0a0a;
        --paper: #f5f5f3;
        --panel: rgba(255, 255, 255, 0.06);
        --panel-border: rgba(255, 255, 255, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--ink);
        color: #f0f0f0;
        font-family: Inter, "DM Sans", system-ui, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.05;
        mix-blend-mode: overlay;
        background-image: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.18), transparent 30%),
          radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.12), transparent 38%);
      }

      .card {
        width: min(920px, 100%);
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        padding: clamp(24px, 4vw, 48px);
        background: var(--panel);
        backdrop-filter: blur(20px) saturate(180%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 10px 40px rgba(0, 0, 0, 0.35);
      }

      .eyebrow {
        margin: 0;
        font: 500 10px/1.4 "JetBrains Mono", "Space Mono", ui-monospace, monospace;
        text-transform: uppercase;
        letter-spacing: 0.28em;
        color: rgba(255, 255, 255, 0.62);
      }

      h1 {
        margin: 16px 0 0;
        min-height: 2.3em;
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.02em;
        font-size: clamp(34px, 6vw, 72px);
      }

      .cursor {
        display: inline-block;
        width: 0.65ch;
        animation: blink 0.9s step-end infinite;
      }

      @keyframes blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }

      .sub {
        margin: 18px 0 0;
        max-width: 58ch;
        color: rgba(255, 255, 255, 0.74);
        font-size: clamp(14px, 1.6vw, 18px);
      }

      .status {
        margin: 24px 0 0;
        display: flex;
        align-items: center;
        gap: 10px;
        font: 500 11px/1.4 "JetBrains Mono", "Space Mono", ui-monospace, monospace;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.7);
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: #9bf6be;
        box-shadow: 0 0 0 0 rgba(155, 246, 190, 0.9);
        animation: pulse 1.8s infinite;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(155, 246, 190, 0.9);
        }
        70% {
          box-shadow: 0 0 0 12px rgba(155, 246, 190, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(155, 246, 190, 0);
        }
      }
    </style>
  </head>
  <body>
    <section class="card">
      <p class="eyebrow">Ravneet Edits</p>
      <h1><span id="type-target"></span><span class="cursor">|</span></h1>
      <p class="sub">I am currently updating the portfolio and adding new work. Please check back shortly.</p>
      <div class="status"><span class="dot"></span><span>Status: In progress</span></div>
    </section>

    <script>
      (function () {
        var text = 'Website in development';
        var target = document.getElementById('type-target');
        var hiddenPath = '/__maint_4fd3c8b9a71e/';
        var i = 0;

        function step() {
          if (i <= text.length) {
            target.textContent = text.slice(0, i);
            i += 1;
            setTimeout(step, 85);
          }
        }

        function checkMode() {
          fetch('/__mode_probe__?t=' + Date.now(), { cache: 'no-store' })
            .then(function (response) {
              var finalUrl = response.url || '';
              if (finalUrl.indexOf(hiddenPath) === -1) {
                window.location.replace('/');
              }
            })
            .catch(function () {});
        }

        step();
        setTimeout(checkMode, 1400);
        setInterval(checkMode, 5000);
      })();
    </script>
  </body>
</html>
